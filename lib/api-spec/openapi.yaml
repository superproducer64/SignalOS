openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: teams
    description: Sports team data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /teams:
    get:
      operationId: getTeams
      tags: [teams]
      summary: Get all teams
      description: Returns all sports team cards with score, highlight, and trade news
      responses:
        "200":
          description: List of team cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamCard"
  /teams/{teamId}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a single team card
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Team card data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCard"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Score:
      allOf:
        - $ref: "#/components/schemas/SignalScoreFields"
        - type: object
          properties:
            homeTeam:
              type: string
            awayTeam:
              type: string
            homeScore:
              type: integer
            awayScore:
              type: integer
            status:
              type: string
              description: "e.g. FINAL, IN PROGRESS, UPCOMING"
            gameDate:
              type: string
            quarter:
              type: string
              nullable: true
            timeRemaining:
              type: string
              nullable: true
          required:
            - homeTeam
            - awayTeam
            - homeScore
            - awayScore
            - status
            - gameDate
    SignalScoreFields:
      type: object
      description: Signal scoring fields added to every story object
      properties:
        signalScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Relevance score 0-100 based on user preferences and recency
        reasons:
          type: array
          items:
            type: string
          description: Human-readable list of factors that contributed to the score (e.g. "Favorite Team +40")
      required:
        - signalScore
        - reasons
    Highlight:
      allOf:
        - $ref: "#/components/schemas/SignalScoreFields"
        - type: object
          properties:
            title:
              type: string
            description:
              type: string
            player:
              type: string
            timestamp:
              type: string
            imageUrl:
              type: string
              nullable: true
          required:
            - title
            - description
            - player
            - timestamp
    TradeNews:
      allOf:
        - $ref: "#/components/schemas/SignalScoreFields"
        - type: object
          properties:
            headline:
              type: string
            summary:
              type: string
            player:
              type: string
            date:
              type: string
            type:
              type: string
              description: "e.g. TRADE, SIGNING, RELEASE, INJURY"
            imageUrl:
              type: string
              nullable: true
          required:
            - headline
            - summary
            - player
            - date
            - type
    TeamCard:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        league:
          type: string
        sport:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        imageUrl:
          type: string
          nullable: true
        score:
          $ref: "#/components/schemas/Score"
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/Highlight"
        tradeNews:
          type: array
          items:
            $ref: "#/components/schemas/TradeNews"
      required:
        - id
        - name
        - city
        - league
        - sport
        - primaryColor
        - secondaryColor
        - score
        - highlights
        - tradeNews
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
